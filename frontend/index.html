<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MindVault</title>
    <link rel="styleSheet" href="style.css">
</head>
<body>
    <div id="appContainer">
        <aside id="sidebar">
            <div class="brand">
                <h2>MindVault</h2>
                <span id="healthIndicator" class="status-offline"></span>
            </div>
            <div class="sidebar-action">
                <button id="newNoteBtn">+ New Notes</button>
            </div>
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Search notes..."/>
            </div>
            <ul id="notesList">
                <!--Dynamice list items here-->
            </ul>
        </aside>
        <main id="mainContent">
            <header id="editorheader">
                <input type="text" id="noteTitleInput" placeholder="Note Title...."/>
                <div class="header-actions">
                    <button id="deleteNoteBtn" class="danger">Delete</button>
                </div>
            </header>
            <div id="tagsContainer">
                <input type="text" id="noteTagsInput" placeholder="Tags (comma seperated)..."/>
            </div>
            <textarea id="noteContentInput" placeholder="Write your thoughts in markdown...."></textarea>

        </main>
    </div>
    <script type="module" src="app.js"></script>
</body>

</html>
